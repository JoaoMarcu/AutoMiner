name: Release AutoMiner

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Fabric mod
        working-directory: fabric-mod
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: autominer-mod
          path: fabric-mod/build/libs/*.jar

  build-manager:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Build NSIS installer
        run: pnpm manager:build
      - uses: actions/upload-artifact@v4
        with:
          name: autominer-manager-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-mod, build-manager]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Generate checksums
        run: find dist -type f -exec sha256sum {} \; > dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.jar
            dist/**/*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
