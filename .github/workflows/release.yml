name: Release AutoMiner

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run:           test "${GITHUB_REF_NAME#v}" = "$(jq -r .version release-config.json)"
      - name: Build Fabric mod
        working-directory: fabric-mod
        run: gradle build
      - name: Stage mod and checksum
        shell: bash
        run: |
          mkdir -p dist
          VERSION=$(jq -r .version release-config.json)
          cp "fabric-mod/build/libs/autominer-${VERSION}.jar" "dist/autominer-${VERSION}.jar"
          cd dist && sha256sum "autominer-${VERSION}.jar" > "autominer-${VERSION}.jar.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: autominer-mod
          path: dist/*
          if-no-files-found: error

  build-manager:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Validate web build
        run: pnpm build
      - name: Test Rust core
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Load release configuration
        shell: pwsh
        run: |
          $config = Get-Content release-config.json | ConvertFrom-Json
          "AUTOMINER_GITHUB_REPO=$($config.githubOwner)/$($config.githubRepository)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build NSIS installer
        run: pnpm manager:build
      - name: Stage installer and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          Copy-Item $installer.FullName "dist/AutoMiner-Setup.exe"
          $hash = (Get-FileHash "dist/AutoMiner-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  AutoMiner-Setup.exe" | Set-Content -NoNewline "dist/AutoMiner-Setup.exe.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: autominer-manager-windows
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-mod, build-manager]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Verify and assemble release assets
        shell: bash
        run: |
          VERSION=$(jq -r .version release-config.json)
          OWNER=$(jq -r .githubOwner release-config.json)
          REPO=$(jq -r .githubRepository release-config.json)
          TAG=$(jq -r .releaseTag release-config.json)
          MOD="dist/autominer-mod/autominer-${VERSION}.jar"
          SETUP="dist/autominer-manager-windows/AutoMiner-Setup.exe"
          test -f "$MOD" && test -f "$SETUP"
          (cd "$(dirname "$MOD")" && sha256sum --check "$(basename "$MOD").sha256")
          (cd "$(dirname "$SETUP")" && sha256sum --check "$(basename "$SETUP").sha256")
          jq -n --arg version "$VERSION" --arg minecraftVersion "$(jq -r .minecraftVersion release-config.json)" --arg release "$TAG" --arg manager "https://github.com/$OWNER/$REPO/releases/download/$TAG/AutoMiner-Setup.exe" --arg mod "https://github.com/$OWNER/$REPO/releases/download/$TAG/autominer-$VERSION.jar" --arg checksums "https://github.com/$OWNER/$REPO/releases/download/$TAG/SHA256SUMS.txt" '{version:$version,minecraftVersion:$minecraftVersion,release:$release,assets:{manager:$manager,mod:$mod,checksums:$checksums}}' > dist/manifest.json
          jq empty dist/manifest.json
          ! grep -Eiq 'example\.com|localhost|YOUR_USERNAME|YOUR_REPOSITORY|placeholder' dist/manifest.json
          (cd dist/autominer-mod && sha256sum "autominer-${VERSION}.jar") > dist/SHA256SUMS.txt
          (cd dist/autominer-manager-windows && sha256sum AutoMiner-Setup.exe) >> dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/autominer-mod/*.jar
            dist/autominer-manager-windows/AutoMiner-Setup.exe
            dist/manifest.json
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
